<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08130f"><title>THIỀN NIỆM — 6 Núi + 1 Suối</title>
<style>
:root{--gold:#e8ce91;--gold2:#fff0c7;--ink:#07110e;--panel:rgba(9,20,17,.91);--line:rgba(232,206,145,.38);--muted:#c9c2ad}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06100d;color:#f8f1df;font-family:Georgia,"Times New Roman",serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 22%,#365344,#10241b 48%,#030906)}
.scene{position:absolute;inset:-1.2%;background-position:50% 50%;background-size:cover;background-repeat:no-repeat;will-change:background-position;animation:landscapeDrift 42s ease-in-out infinite alternate}
.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,rgba(255,225,159,.12),transparent 48%);opacity:.7;animation:softGlow 12s ease-in-out infinite alternate;pointer-events:none}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.02) 48%,rgba(0,0,0,.38));pointer-events:none}@keyframes landscapeDrift{0%{background-position:50% 47%;}100%{background-position:50% 53%;}}@keyframes softGlow{0%{opacity:.35}100%{opacity:.85}}@media(prefers-reduced-motion:reduce){.scene,.scene:before{animation:none}}
.fallback{position:absolute;inset:0;width:100%;height:100%}
.topbar{position:absolute;z-index:4;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:14px 60px;text-align:center;pointer-events:none}
.brand{font-size:clamp(16px,2.6vw,22px);letter-spacing:.2em;color:var(--gold2);text-shadow:0 0 15px #d6ad5c}.subbrand{font:9px Arial;letter-spacing:.25em;color:#e4d7b7;margin-top:5px}
.gear{position:absolute;right:12px;top:12px;pointer-events:auto;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;color:var(--gold2);background:#09140dbb;backdrop-filter:blur(8px)}
.landmarks{position:absolute;z-index:2;inset:10% 9% 19%;pointer-events:none}
.place{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;color:var(--gold2);padding:7px 4px;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.11em;font-size:clamp(13px,1.8vw,20px);line-height:1.45;text-shadow:0 0 4px #251900,0 0 12px #d6a64e,0 0 22px #e7c779;pointer-events:auto;white-space:nowrap}
.place small{font:9px Arial;writing-mode:horizontal-tb;display:block;margin-top:6px;color:#fff0c7}
.side{position:absolute;z-index:6;top:50%;transform:translateY(-50%);width:40px;display:flex;flex-direction:column;gap:5px;transition:width .28s ease}
.side.left{left:0;align-items:flex-start}.side.right{right:0;align-items:flex-end}
.side.open{width:116px}.side-toggle{width:36px;height:40px;border:1px solid var(--line);border-radius:0 15px 15px 0;background:#0a1b14dd;color:var(--gold2);font-size:20px;box-shadow:0 4px 20px #0008;backdrop-filter:blur(8px)}
.right .side-toggle{border-radius:15px 0 0 15px}
.side-items{display:flex;flex-direction:column;gap:6px;width:100%;overflow:hidden;max-height:0;opacity:0;transition:max-height .28s,opacity .2s}
.side.open .side-items{max-height:75svh;opacity:1}
.side-btn{display:flex;align-items:center;gap:6px;width:100%;min-height:34px;padding:5px 7px;border:1px solid rgba(232,206,145,.24);background:#0a1a13e8;color:#f8e8bd;border-radius:0 12px 12px 0;text-align:left;font:12px Arial;white-space:nowrap;backdrop-filter:blur(9px)}
.right .side-btn{border-radius:12px 0 0 12px;flex-direction:row-reverse;text-align:right}.side-btn .ico{font-size:15px;width:18px;text-align:center}.side-btn span:last-child{opacity:0;transition:opacity .15s}.side.open .side-btn span:last-child{opacity:1}
.mok-stage{position:absolute;z-index:4;left:50%;top:57%;transform:translate(-50%,-50%);width:min(48vw,300px);height:min(38vw,230px);min-width:190px;min-height:145px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mok-art{width:100%;height:100%;filter:drop-shadow(0 12px 20px #000b);transform-origin:50% 55%;transition:transform .12s}
.mok-art.hit{animation:mokHit .22s ease}@keyframes mokHit{0%{transform:scale(1)}35%{transform:scale(.96) rotate(-1deg)}100%{transform:scale(1)}}
.striker{position:absolute;z-index:5;width:12px;height:145px;border-radius:12px;background:linear-gradient(90deg,#4b2817,#c38a56 35%,#6b3b23 75%,#32180f);border:1px solid #2a170f;box-shadow:0 4px 9px #0009;left:72%;top:9%;transform:rotate(-25deg);transform-origin:50% 90%;pointer-events:none}
.striker:before{content:"";position:absolute;top:-26px;left:-12px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#e8c89c,#986343 55%,#422719);border:2px solid #321b10;box-shadow:inset 0 2px 5px #fff6}
.striker.hit{animation:strike .25s ease}@keyframes strike{0%{transform:rotate(-25deg)}45%{transform:rotate(12deg) translate(-8px,10px)}100%{transform:rotate(-25deg)}}
.mok-hit{position:absolute;inset:0;pointer-events:none}.mok-hit:after{content:"";position:absolute;left:48%;top:46%;width:40px;height:40px;border:2px solid #ffe5a4;border-radius:50%;opacity:0;transform:scale(.2)}.mok-hit.show:after{animation:ripple .65s ease-out}@keyframes ripple{to{transform:scale(3.5);opacity:0}}
.mok-button{position:absolute;inset:0;border:0;background:transparent;pointer-events:auto;cursor:pointer}
.bottom-stats{position:absolute;z-index:4;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:24px;align-items:center;padding:8px 18px;border:1px solid #d9bd7c55;border-radius:40px;background:#07140fb8;backdrop-filter:blur(8px);font:10px Arial;letter-spacing:.12em;color:#e9d8b0}
.bottom-stats strong{font:20px Georgia;color:#fff0c7;margin-left:7px}
.toast{position:absolute;z-index:8;left:50%;bottom:90px;transform:translateX(-50%);color:#fff0bd;font:15px Georgia;text-shadow:0 0 12px #ffcc6b;opacity:0;pointer-events:none}.toast.show{animation:rise 1.1s ease both}@keyframes rise{0%{transform:translate(-50%,12px);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-35px);opacity:0}}
.modal-backdrop{display:none;position:fixed;z-index:20;inset:0;background:#000b;backdrop-filter:blur(7px);align-items:center;justify-content:center;padding:14px}.modal-backdrop.open{display:flex}
.modal{width:min(680px,100%);max-height:88svh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#182c22f7,#07120dfc);box-shadow:0 24px 80px #000;padding:22px;position:relative}
.modal.wide{width:min(960px,100%)}.close{position:sticky;float:right;top:0;border:0;background:#13231bd9;color:#f5e4b8;font-size:25px;border-radius:50%;width:34px;height:34px;z-index:2}
.modal h2{color:var(--gold2);font-weight:normal;margin:6px 40px 12px 0}.modal p{color:#e2ded3;line-height:1.65}.eyebrow{font:10px Arial;letter-spacing:.2em;color:#c9a969;text-transform:uppercase}
.primary,.secondary,.danger{border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:#f6e8c5;background:#bd91492e}.secondary{background:#ffffff0c}.danger{border-color:#854f4f;color:#ffd1c7;background:#78232333}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.field{display:grid;gap:6px;margin:11px 0}.field label{font:12px Arial;color:#d8c99e}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #dcc38f40;border-radius:8px;background:#081821;color:#f6f0e3;min-width:0}.field textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font:11px/1.6 Arial;color:#aeb7b5}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tab{padding:8px 10px;border:1px solid var(--line);border-radius:20px;background:transparent;color:#d8cfb8;font:12px Arial}.tab.active{background:#cea45b33;color:#fff0c4}.item{border:1px solid #dcc38f2b;border-radius:12px;padding:12px;margin:9px 0;background:#ffffff06}.item h3{margin:0 0 7px;color:#f2dfb4;font-size:17px}.item p{margin:5px 0}.plant{font-size:52px}.progress{height:7px;background:#24343a;border-radius:10px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#82b88b,#e4d18b);width:0}.hidden{display:none!important}
@media(max-width:560px){.side{width:34px}.side.open{width:104px}.side-toggle{width:32px;height:36px}.side-btn{min-height:31px;padding:4px 5px;font-size:10px}.side-btn .ico{font-size:14px;width:16px}.topbar{padding-top:10px}.landmarks{inset:11% 11% 20%}.place{font-size:11px;letter-spacing:.06em}.side{width:38px}.side.open{width:126px}.side-toggle{width:36px;height:43px;font-size:17px}.side-btn{min-height:39px;font-size:11px;padding:6px}.mok-stage{top:57%;width:58vw;height:43vw;min-width:185px;min-height:140px}.striker{height:120px}.bottom-stats{bottom:10px;gap:10px;padding:7px 12px;font-size:9px}.bottom-stats strong{font-size:17px}.modal{padding:16px}.two{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app" id="app">
<div class="scene" id="scene">
<svg class="fallback" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#142c26"/><stop offset=".55" stop-color="#244537"/><stop offset="1" stop-color="#08140f"/></linearGradient><linearGradient id="mount" x2="0" y2="1"><stop stop-color="#607b66"/><stop offset="1" stop-color="#0b2118"/></linearGradient><radialGradient id="halo"><stop stop-color="#f0d89c" stop-opacity=".8"/><stop offset="1" stop-color="#e6c77d" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="800" fill="url(#sky)"/><circle cx="600" cy="225" r="250" fill="url(#halo)"/><path d="M0 530L160 260 270 430 430 150 590 440 760 190 940 440 1080 250 1200 500V800H0Z" fill="#294b3a"/><path d="M0 600L200 380 330 520 510 290 680 550 850 300 1030 560 1150 390 1200 520V800H0Z" fill="url(#mount)"/><path d="M0 640Q170 560 320 620T650 610T930 620T1200 580V800H0Z" fill="#102a20"/><path d="M580 345Q600 420 570 500Q560 560 620 640" stroke="#dce8d5" stroke-width="17" fill="none" opacity=".8"/><path d="M600 345Q630 430 610 510Q600 570 650 650" stroke="#a8d5c4" stroke-width="4" fill="none" opacity=".65"/>
<g transform="translate(600 190)" fill="#d9c69b" opacity=".8"><path d="M-52 40Q-50 0 0-30Q50 0 52 40L38 47H-38Z"/><path d="M-70 45H70L55 55H-55Z"/><path d="M-45 5L0-45 45 5Z"/></g></svg></div>
<header class="topbar"><div><div class="brand">THIỀN NIỆM</div><div class="subbrand">6 NÚI · 1 SUỐI · AN NHIÊN TỰ TẠI</div></div><button class="gear" id="adminOpen" aria-label="Mở quản trị">⚙</button></header>
<nav class="landmarks" id="landmarks" aria-label="Bảy địa danh"></nav>
<aside class="side left" id="leftSide"><button class="side-toggle" aria-label="Mở hoặc thu gọn menu trái" id="leftToggle">›</button><div class="side-items" id="leftItems"></div></aside>
<aside class="side right" id="rightSide"><button class="side-toggle" aria-label="Mở hoặc thu gọn menu phải" id="rightToggle">‹</button><div class="side-items" id="rightItems"></div></aside>
<div class="mok-stage" id="mokStage">
<svg class="mok-art" id="mokArt" viewBox="0 0 360 230" aria-label="Mõ gỗ">
<defs><radialGradient id="wood" cx="36%" cy="25%"><stop stop-color="#d9ad7c"/><stop offset=".4" stop-color="#986440"/><stop offset=".78" stop-color="#59351f"/><stop offset="1" stop-color="#29170f"/></radialGradient><radialGradient id="innerWood"><stop stop-color="#c18b5c"/><stop offset="1" stop-color="#60391f"/></radialGradient></defs>
<ellipse cx="180" cy="126" rx="137" ry="91" fill="url(#wood)" stroke="#2a170f" stroke-width="5"/><ellipse cx="180" cy="126" rx="111" ry="69" fill="none" stroke="#e6bd8a" stroke-opacity=".35" stroke-width="2"/><path d="M135 110q12 11 24 0M201 110q12 11 24 0" fill="none" stroke="#382015" stroke-width="5" stroke-linecap="round"/><path d="M153 143q27 23 54 0" fill="none" stroke="#2c170f" stroke-width="5" stroke-linecap="round"/><ellipse cx="180" cy="160" rx="15" ry="5" fill="#28160f" opacity=".35"/>
</svg><div class="striker" id="striker"></div><div class="mok-hit" id="mokRipple"></div><button class="mok-button" id="mokHit" aria-label="Gõ mõ" title="Nhấn để gõ mõ"></button></div>
<div class="bottom-stats"><span>CÔNG ĐỨC <strong id="merit">0</strong></span><span>GIỌT TỪ BI <strong id="drops">0</strong></span></div><div class="toast" id="toast">+1 Công Đức · +1 Giọt Từ Bi</div>
</main>

<div class="modal-backdrop" id="modal"><section class="modal" id="modalBox" role="dialog" aria-modal="true"><button class="close" id="modalClose">×</button><div id="modalContent"></div></section></div>
<div class="modal-backdrop" id="adminModal"><section class="modal wide" role="dialog" aria-modal="true"><button class="close" id="adminClose">×</button><div class="eyebrow">Bảng quản trị trực tiếp</div><h2>Quản trị THIỀN NIỆM</h2><div class="tabs" id="adminTabs"><button class="tab active" data-tab="places">7 địa danh</button><button class="tab" data-tab="background">Hình nền</button><button class="tab" data-tab="content">Kinh sách & nội dung</button><button class="tab" data-tab="audio">Âm thanh</button><button class="tab" data-tab="mok">Mõ & dùi</button><button class="tab" data-tab="backup">Sao lưu</button></div><div id="adminBody"></div></section></div>
<audio id="audioPlayer"></audio><audio id="mokAudioPlayer" src="assets/tieng-mo.mp3" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));
const defaults=[
{id:'stream',name:'Suối Thanh Lọc',short:'Thanh lọc',description:'Dừng lại bên dòng suối, lắng nghe hơi thở và để những phiền muộn trôi qua. Thực tập buông thư, tha thứ và làm mới tâm mình.',mobile:{x:16,y:54},desktop:{x:17,y:55},visible:true},
{id:'compassion',name:'Núi Từ Bi',short:'Từ bi',description:'Quán niệm lòng từ, nuôi dưỡng sự cảm thông với bản thân và mọi người. Hình dung ánh sáng dịu lành lan tỏa từ trái tim.',mobile:{x:27,y:39},desktop:{x:28,y:40},visible:true},
{id:'vow',name:'Núi Lời Nguyện',short:'Lời nguyện',description:'Nhớ về ân nghĩa tổ tiên, cha mẹ và những người đã nâng đỡ ta. Phát nguyện sống thiện lành, hiếu kính và biết ơn.',mobile:{x:39,y:25},desktop:{x:39,y:27},visible:true},
{id:'healing',name:'Núi Chữa Lành',short:'Chữa lành',description:'Trở về với thân tâm bằng hơi thở nhẹ nhàng. Cho phép mình nghỉ ngơi, phục hồi và đón nhận sự bình an.',mobile:{x:51,y:39},desktop:{x:51,y:40},visible:true},
{id:'wisdom',name:'Núi Trí Tuệ',short:'Trí tuệ',description:'Lắng tâm để nhìn sâu, phân biệt điều cần thiết và điều nên buông. Nuôi dưỡng sự sáng suốt, tập trung và hiểu biết.',mobile:{x:63,y:25},desktop:{x:63,y:27},visible:true},
{id:'lettinggo',name:'Núi Buông Bỏ',short:'Buông bỏ',description:'Nhìn nhận những điều đang níu giữ mình. Thở vào nhận biết, thở ra thả lỏng; không chống cự, không phán xét.',mobile:{x:75,y:39},desktop:{x:74,y:40},visible:true},
{id:'pureland',name:'Núi Tịnh Độ',short:'Tịnh độ',description:'An trú trong câu niệm Phật, giữ tâm chân thành và thanh tịnh. Mỗi hơi thở là một bước trở về với sự an nhiên.',mobile:{x:86,y:54},desktop:{x:85,y:55},visible:true}
];
let state={places:clone(defaults),merit:0,drops:0,plant:0,contents:[],audios:[],journal:[],mobileBg:'',desktopBg:'',chantCount:0,meditationMinutes:0,mokImage:'',strikerImage:'',mokAudio:''};
try{const saved=JSON.parse(localStorage.getItem('thienniem_v2'));if(saved)state={...state,...saved,places:saved.places||clone(defaults)}}catch(e){}
let db;const dbReady=new Promise((resolve,reject)=>{const r=indexedDB.open('ThienNiemV2',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)});
function dbPut(k,v){return dbReady.then(d=>new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)}))}
function dbGet(k){return dbReady.then(d=>new Promise((res,rej)=>{const r=d.transaction('files').objectStore('files').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function dbDel(k){return dbReady.then(d=>new Promise(res=>{const t=d.transaction('files','readwrite');t.objectStore('files').delete(k);t.oncomplete=res}))}
function save(){localStorage.setItem('thienniem_v2',JSON.stringify(state));renderStats()}
function isMobile(){return matchMedia('(max-width:700px)').matches}
function renderStats(){$('merit').textContent=state.merit;$('drops').textContent=state.drops}
function renderPlaces(){const box=$('landmarks');box.innerHTML='';state.places.forEach(p=>{if(!p.visible)return;const pos=isMobile()?p.mobile:p.desktop;const b=document.createElement('button');b.className='place';b.style.left=pos.x+'%';b.style.top=pos.y+'%';b.innerHTML=`${esc(p.name)}<small>✧</small>`;b.onclick=()=>showPlace(p.id);box.append(b)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(html){$('modalContent').innerHTML=html;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open');$('audioPlayer').pause()}
$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function showPlace(id){const p=state.places.find(x=>x.id===id);if(!p)return;const content=state.contents.filter(c=>c.placeId===id);openModal(`<div class="eyebrow">Không gian tĩnh tâm · ${esc(p.short)}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><h3>Thực tập gợi ý</h3><p>Ngồi yên trong vài phút. Thả lỏng vai, nhận biết hơi thở tự nhiên và đọc thầm lời nguyện phù hợp với tâm mình hôm nay.</p>${content.map(c=>`<article class="item"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></article>`).join('')}<div class="row"><button class="primary" onclick="startMeditation(3)">⏳ Tĩnh tâm 3 phút</button><button class="secondary" onclick="playFirstAudio('${id}')">♫ Nghe âm thanh</button></div>`)}
function toast(){const t=$('toast');t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}
let audioCtx;
async function strikeMok(){
  try{
    const custom=await dbGet('mokAudio');
    const player=$('mokAudioPlayer');
    if(custom){player.src=URL.createObjectURL(custom)}
    else if(!player.src) player.src='assets/tieng-mo.mp3';
    player.currentTime=0;const playPromise=player.play();if(playPromise)await playPromise;
  }catch(e){console.warn('Không phát được âm thanh mõ:',e)}
  const striker=$('striker'),art=$('mokArt'),rip=$('mokRipple');
  striker.classList.remove('hit');art.classList.remove('hit');rip.classList.remove('show');
  void striker.offsetWidth;striker.classList.add('hit');art.classList.add('hit');rip.classList.add('show');
  state.merit++;state.drops++;save();toast()
}
$('mokHit').onclick=strikeMok;
const leftMenu=[['⌂','Trang chủ','home'],['☸','7 địa danh','places'],['📖','Kinh sách','books'],['♫','Âm thanh','audio'],['ॐ','Niệm Phật','chant']];
const rightMenu=[['◉','Thiền định','meditate'],['🌱','Vườn Tịnh Tâm','garden'],['🏆','BXH','leaderboard'],['✧','Công Đức','merit'],['✎','Nhật ký','journal'],['☯','Giới thiệu','about']];
function drawMenus(){[['leftItems',leftMenu],['rightItems',rightMenu]].forEach(([id,items])=>{const el=$(id);el.innerHTML='';items.forEach(([ico,label,act])=>{const b=document.createElement('button');b.className='side-btn';b.innerHTML=`<span class="ico">${ico}</span><span>${label}</span>`;b.onclick=()=>{if(act==='home')home();else if(act==='places')openModal('<div class="eyebrow">Hành trình nội tâm</div><h2>Bảy miền tĩnh lặng</h2>'+state.places.map(p=>`<article class="item"><button class="primary" onclick="showPlace('${p.id}')">${esc(p.name)}</button></article>`).join(''));else if(act==='books')books();else if(act==='audio')audioLibrary();else if(act==='chant')chant();else if(act==='meditate')meditate();else if(act==='garden')garden();else if(act==='merit')merit();else if(act==='leaderboard')leaderboard();else if(act==='journal')journal();else about()};el.append(b)})})}
function toggleSide(side){const el=$(side+'Side');el.classList.toggle('open');$(side+'Toggle').textContent=el.classList.contains('open')?(side==='left'?'‹':'›'):(side==='left'?'›':'‹')}
$('leftToggle').onclick=()=>toggleSide('left');$('rightToggle').onclick=()=>toggleSide('right');
function home(){closeModal();$('leftSide').classList.remove('open');$('rightSide').classList.remove('open')}
function books(){openModal(`<div class="eyebrow">Thư viện thực tập</div><h2>Kinh sách & bài đọc</h2><p>Những bài đọc do quản trị viên thêm sẽ xuất hiện tại đây.</p>${state.contents.map(c=>`<article class="item"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p><small>${esc(state.places.find(p=>p.id===c.placeId)?.name||'Bài đọc chung')}</small></article>`).join('')||'<p>Thư viện đang chờ nội dung đầu tiên.</p>'}`)}
function audioLibrary(){openModal(`<div class="eyebrow">Lắng nghe</div><h2>Thư viện âm thanh</h2>${state.audios.map(a=>`<article class="item"><h3>${esc(a.title)}</h3><p>${esc(state.places.find(p=>p.id===a.placeId)?.name||'Âm thanh chung')}</p><button class="primary" onclick="playAudio('${a.id}')">▶ Phát</button></article>`).join('')||'<p>Chưa có âm thanh. Quản trị viên có thể tải MP3, WAV hoặc OGG trong Bảng quản trị.</p>'}`)}
async function playAudio(id){const a=state.audios.find(x=>x.id===id);if(!a)return;const blob=await dbGet('audio:'+id);if(!blob)return alert('Không tìm thấy tệp âm thanh trên thiết bị.');const el=$('audioPlayer');el.src=URL.createObjectURL(blob);el.play()}
function playFirstAudio(placeId){const a=state.audios.find(x=>x.placeId===placeId)||state.audios[0];if(a)playAudio(a.id);else alert('Chưa có âm thanh trong thư viện.')}
function chant(){openModal(`<div class="eyebrow">Niệm Phật</div><h2>An trú trong câu niệm</h2><p>Giữ nhịp chậm rãi, nhẹ nhàng. Mỗi lần niệm, trở về với tâm chân thành.</p><div class="item" style="text-align:center"><div style="font-size:38px;color:#ffe7ad" id="chantCount">${state.chantCount}</div><p>lần niệm đã ghi nhận</p><button class="primary" onclick="addChant()">🙏 Nam mô A Di Đà Phật · +1</button><button class="secondary" onclick="resetChant()">Đặt lại phiên</button></div>`)}
function addChant(){state.chantCount++;save();$('chantCount').textContent=state.chantCount}function resetChant(){state.chantCount=0;save();$('chantCount').textContent=0}
let medTimer=null,medRemain=0;
function meditate(){openModal(`<div class="eyebrow">Thực tập chánh niệm</div><h2>Thiền định theo thời gian</h2><p>Chọn thời lượng, ngồi thoải mái và nhẹ nhàng theo dõi hơi thở.</p><div class="row"><button class="secondary" onclick="startMeditation(3)">3 phút</button><button class="secondary" onclick="startMeditation(5)">5 phút</button><button class="secondary" onclick="startMeditation(10)">10 phút</button></div><h2 id="medClock" style="text-align:center;font-size:36px">Chọn thời lượng</h2><p id="medState" style="text-align:center">Hít vào nhẹ nhàng · Thở ra thư thái</p><button class="primary" onclick="stopMeditation()">Kết thúc phiên</button>`)}
function startMeditation(min){clearInterval(medTimer);medRemain=min*60;$('medClock').textContent=fmt(medRemain);$('medState').textContent='Bắt đầu an trú';medTimer=setInterval(()=>{medRemain--;$('medClock').textContent=fmt(medRemain);if(medRemain<=0){stopMeditation(true)}},1000)}
function fmt(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')}
function stopMeditation(done=false){clearInterval(medTimer);medTimer=null;if(done){state.meditationMinutes+=1;save();$('medState').textContent='Hoàn thành phiên tĩnh tâm. Chúc bạn an lành.'}else if($('medState'))$('medState').textContent='Phiên thiền đã kết thúc.'}
function garden(){const plants=['🌰','🌱','🌿','🪴','🌳'];openModal(`<div class="eyebrow">Nuôi dưỡng hạt lành</div><h2>Vườn Cây Tịnh Tâm</h2><div class="item" style="display:flex;gap:18px;align-items:center"><div class="plant">${plants[state.plant]||'🌳'}</div><div style="flex:1"><strong>${['Hạt mầm','Nảy mầm','Cây non','Cây lớn','Cây viên mãn'][state.plant]}</strong><div class="progress"><span style="width:${state.plant*25}%"></span></div><small>${state.drops} giọt đang có · cần 5 giọt mỗi lần tưới</small></div></div><button class="primary" onclick="waterPlant()">💧 Tưới cây (5 giọt)</button>`)}
function waterPlant(){if(state.drops<5)return alert('Bạn cần 5 Giọt Nước Từ Bi.');if(state.plant>=4)return alert('Cây đã trưởng thành viên mãn.');state.drops-=5;state.plant++;save();garden()}
function merit(){openModal(`<div class="eyebrow">Hành trình thiện lành</div><h2>Công Đức</h2><div class="item"><p>Tổng lượt gõ mõ: <b>${state.merit}</b></p><p>Giọt Nước Từ Bi hiện có: <b>${state.drops}</b></p><p>Số lần niệm Phật: <b>${state.chantCount}</b></p><p>Thời lượng thiền đã hoàn tất: <b>${state.meditationMinutes}</b> phút</p><p>Cấp độ cây Tịnh Tâm: <b>${state.plant+1}/5</b></p></div><p class="hint">Các chỉ số được lưu trên trình duyệt và thiết bị hiện tại.</p>`)}
function leaderboard(){const score=state.merit+state.chantCount+state.meditationMinutes;const levels=[['Người mới gieo duyên',0],['Người vun bồi thiện tâm',20],['Người kiên trì tinh tấn',100],['Người lan tỏa từ bi',300],['Hành giả an nhiên',1000]];let level=levels[0];for(const x of levels)if(score>=x[1])level=x;const next=levels.find(x=>x[1]>score);openModal(`<div class="eyebrow">BXH · Bảng xếp hạng</div><h2>Hành trình tinh tấn</h2><article class="item"><div style="font-size:30px">🏆</div><h3>${level[0]}</h3><p>Điểm thiện lành: <b>${score}</b></p><p>Tổng lượt gõ mõ: ${state.merit} · Niệm Phật: ${state.chantCount} · Thiền hoàn tất: ${state.meditationMinutes} phút</p>${next?`<div class="progress"><span style="width:${Math.min(100,score/next[1]*100)}%"></span></div><small>Còn ${next[1]-score} điểm để đạt cấp tiếp theo: ${next[0]}</small>`:'<p>Bạn đã đạt cấp độ cao nhất trong bảng thành tích hiện tại.</p>'}</article><p class="hint">BXH hiện là bảng thành tích cá nhân lưu trên thiết bị. Muốn xếp hạng giữa nhiều người dùng cần bổ sung tài khoản và cơ sở dữ liệu máy chủ.</p>`)}
function journal(){openModal(`<div class="eyebrow">Ghi lại sự an yên</div><h2>Nhật ký tĩnh tâm</h2><div class="field"><label>Hôm nay tôi biết ơn điều gì?</label><textarea id="journalText" placeholder="Viết vài dòng cho riêng mình..."></textarea></div><button class="primary" onclick="saveJournal()">Lưu nhật ký</button><h3>Các ghi chép gần đây</h3>${state.journal.slice().reverse().map(j=>`<article class="item"><small>${new Date(j.date).toLocaleString('vi-VN')}</small><p>${esc(j.text)}</p></article>`).join('')}`)}
function saveJournal(){const t=$('journalText').value.trim();if(!t)return alert('Hãy viết vài dòng trước khi lưu.');state.journal.push({date:new Date().toISOString(),text:t});save();journal()}
function about(){openModal('<div class="eyebrow">Về không gian này</div><h2>THIỀN NIỆM — 6 Núi + 1 Suối</h2><p>Một không gian thực tập chánh niệm qua bảy miền biểu tượng: Thanh Lọc, Từ Bi, Lời Nguyện, Chữa Lành, Trí Tuệ, Buông Bỏ và Tịnh Độ.</p><p>Cảnh quan là linh hồn của website. Các công cụ được thiết kế nhẹ nhàng để nâng đỡ việc trở về với hơi thở, lòng biết ơn và sự an nhiên.</p><p class="hint">Bản thử nghiệm lưu dữ liệu cục bộ trên trình duyệt.</p>')}

$('adminOpen').onclick=adminOpen;$('adminClose').onclick=()=>$('adminModal').classList.remove('open');$('adminModal').onclick=e=>{if(e.target===$('adminModal'))$('adminModal').classList.remove('open')};
const tabs=['places','background','content','audio','mok','backup'];let activeTab='places';
function adminOpen(){$('adminModal').classList.add('open');renderAdmin()}
function renderAdmin(){document.querySelectorAll('#adminTabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));$('adminBody').innerHTML=activeTab==='places'?adminPlaces():activeTab==='background'?adminBackground():activeTab==='content'?adminContent():activeTab==='audio'?adminAudio():activeTab==='mok'?adminMok():adminBackup();if(activeTab==='places')loadPlaceForm()}
$('adminTabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;activeTab=b.dataset.tab;renderAdmin()};
function adminPlaces(){return `<div class="field"><label>Chọn địa danh</label><select id="pSelect">${state.places.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div id="pEdit"></div><p class="hint">Tọa độ tính theo phần trăm vùng ảnh nền. Chỉnh riêng cho điện thoại và máy tính.</p>`}
function loadPlaceForm(){const p=state.places.find(x=>x.id===$('pSelect').value)||state.places[0];$('pEdit').innerHTML=`<div class="field"><label>Tên địa danh</label><input id="pName" value="${esc(p.name)}"></div><div class="field"><label>Mô tả / nội dung thực tập</label><textarea id="pDesc">${esc(p.description)}</textarea></div><div class="two"><div><h3>Điện thoại</h3><div class="field"><label>X (%)</label><input id="mx" type="number" min="0" max="100" value="${p.mobile.x}"></div><div class="field"><label>Y (%)</label><input id="my" type="number" min="0" max="100" value="${p.mobile.y}"></div></div><div><h3>Máy tính</h3><div class="field"><label>X (%)</label><input id="dx" type="number" min="0" max="100" value="${p.desktop.x}"></div><div class="field"><label>Y (%)</label><input id="dy" type="number" min="0" max="100" value="${p.desktop.y}"></div></div></div><label><input type="checkbox" id="pVisible" ${p.visible?'checked':''}> Hiển thị địa danh</label><p><button class="primary" id="pSave">Lưu và xem ngay</button></p>`;$('pSave').onclick=()=>{p.name=$('pName').value.trim()||p.name;p.description=$('pDesc').value;p.mobile={x:clamp($('mx').value),y:clamp($('my').value)};p.desktop={x:clamp($('dx').value),y:clamp($('dy').value)};p.visible=$('pVisible').checked;save();renderPlaces();renderAdmin();};}
function clamp(v){return Math.max(0,Math.min(100,Number(v)||0))}
function adminBackground(){return `<div class="field"><label>Ảnh nền dọc cho điện thoại</label><input type="file" id="mobileFile" accept="image/*"></div><div class="field"><label>Ảnh nền ngang cho máy tính</label><input type="file" id="desktopFile" accept="image/*"></div><div class="row"><button class="secondary" id="clearMobile">Xóa ảnh dọc</button><button class="secondary" id="clearDesktop">Xóa ảnh ngang</button></div><p class="hint">Ảnh lưu trong IndexedDB trên thiết bị này. Hình nền được áp dụng ngay sau khi tải lên.</p>`}
function adminContent(){return `<div class="field"><label>Tiêu đề bài đọc</label><input id="cTitle" placeholder="Ví dụ: Bài thực tập lòng từ"></div><div class="field"><label>Nội dung</label><textarea id="cText" placeholder="Nhập nội dung bài đọc..."></textarea></div><div class="field"><label>Gắn với địa danh</label><select id="cPlace">${state.places.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}<option value="">Nội dung chung</option></select></div><div class="row"><button class="primary" id="cAdd">Thêm bài đọc</button><button class="secondary" id="cImport">Nhập tệp TXT</button><input class="hidden" type="file" id="cFile" accept=".txt,text/plain"></div><div id="cList">${state.contents.map((c,i)=>`<article class="item"><b>${esc(c.title)}</b><p>${esc(c.text).slice(0,180)}</p><button class="danger" data-cdel="${i}">Xóa</button></article>`).join('')}</div>`}
function adminAudio(){return `<div class="field"><label>Tên âm thanh</label><input id="aTitle" placeholder="Tiếng chuông / nhạc thiền..."></div><div class="field"><label>Tệp MP3, WAV hoặc OGG</label><input type="file" id="aFile" accept="audio/*"></div><div class="field"><label>Gắn với địa danh</label><select id="aPlace">${state.places.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}<option value="">Âm thanh chung</option></select></div><button class="primary" id="aAdd">Thêm âm thanh</button><div>${state.audios.map(a=>`<article class="item"><b>${esc(a.title)}</b> · ${esc(a.fileName)} <button class="secondary" data-aplay="${a.id}">Nghe</button> <button class="danger" data-adel="${a.id}">Xóa</button></article>`).join('')}</div>`}
function adminMok(){return `<p>Thay hình mõ và dùi bằng ảnh PNG/WebP nền trong suốt. Âm thanh gõ mõ có thể dùng tệp ghi âm thật.</p><div class="field"><label>Ảnh mõ</label><input type="file" id="mokFile" accept="image/*"></div><div class="field"><label>Ảnh dùi</label><input type="file" id="strikerFile" accept="image/*"></div><div class="field"><label>Âm thanh mõ</label><input type="file" id="mokSound" accept="audio/*"></div><p class="hint">Hiện tại mõ SVG và dùi CSS là hình minh họa tương tác. Khi có ảnh thật, hệ thống dùng ảnh đó thay hình mặc định.</p><button class="secondary" id="resetMok">Dùng lại mõ minh họa</button>`}
function adminBackup(){return `<p>Sao lưu hoặc phục hồi nội dung, tọa độ và thống kê.</p><div class="row"><button class="primary" id="export">Xuất JSON</button><button class="secondary" id="import">Nhập JSON</button><input type="file" class="hidden" id="importFile" accept=".json,application/json"></div><hr style="border-color:#ffffff22"><button class="danger" id="resetAll">Khôi phục cấu hình mặc định</button><p class="hint">Bản hiện tại lưu cục bộ. JSON không chứa các tệp ảnh/âm thanh lớn đã lưu trong IndexedDB.</p>`}
$('adminBody').addEventListener('change',async e=>{if(e.target.id==='pSelect')loadPlaceForm();if(e.target.id==='mobileFile'||e.target.id==='desktopFile'){const key=e.target.id==='mobileFile'?'mobileBg':'desktopBg';if(e.target.files[0]){await dbPut(key,e.target.files[0]);await applyBg();alert('Đã cập nhật hình nền.')}}if(e.target.id==='cFile'){const f=e.target.files[0];if(f){$('cText').value=await f.text();if(!$('cTitle').value)$('cTitle').value=f.name.replace(/\.txt$/i,'')}}if(['mokFile','strikerFile','mokSound'].includes(e.target.id)){const f=e.target.files[0];if(f){const key={mokFile:'mokImage',strikerFile:'strikerImage',mokSound:'mokAudio'}[e.target.id];await dbPut(key,f);state[key]=true;save();await applyMokAssets();alert('Đã cập nhật tài nguyên mõ.')}}});
$('adminBody').addEventListener('click',async e=>{const id=e.target.id;if(id==='pSave')return;if(id==='cAdd'){const title=$('cTitle').value.trim(),text=$('cText').value.trim();if(!title||!text)return alert('Nhập tiêu đề và nội dung.');state.contents.push({title,text,placeId:$('cPlace').value});save();renderAdmin()}if(id==='cImport')$('cFile').click();if(e.target.dataset.cdel!==undefined){state.contents.splice(+e.target.dataset.cdel,1);save();renderAdmin()}if(id==='aAdd'){const f=$('aFile').files[0],title=$('aTitle').value.trim();if(!f||!title)return alert('Nhập tên và chọn tệp.');const aid=crypto.randomUUID?crypto.randomUUID():String(Date.now());await dbPut('audio:'+aid,f);state.audios.push({id:aid,title,fileName:f.name,placeId:$('aPlace').value});save();renderAdmin()}if(e.target.dataset.aplay)playAudio(e.target.dataset.aplay);if(e.target.dataset.adel){await dbDel('audio:'+e.target.dataset.adel);state.audios=state.audios.filter(a=>a.id!==e.target.dataset.adel);save();renderAdmin()}if(id==='clearMobile'){await dbDel('mobileBg');await applyBg()}if(id==='clearDesktop'){await dbDel('desktopBg');await applyBg()}if(id==='resetMok'){for(const k of ['mokImage','strikerImage','mokAudio']){await dbDel(k);state[k]=''}save();applyMokAssets()}if(id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});download(blob,'thien-niem-backup.json')}if(id==='import')$('importFile').click();if(id==='resetAll'){if(confirm('Khôi phục toàn bộ dữ liệu mặc định?')){state={...state,places:clone(defaults),merit:0,drops:0,plant:0,contents:[],audios:[],journal:[],chantCount:0,meditationMinutes:0};save();renderPlaces();renderAdmin()}}});
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('adminBody').addEventListener('change',async e=>{if(e.target.id==='importFile'){const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.places)||x.places.length!==7)throw Error('Cần đúng 7 địa danh.');state={...state,...x};save();renderPlaces();renderAdmin();alert('Đã nhập dữ liệu.')}catch(err){alert('Tệp không hợp lệ: '+err.message)}}});
async function applyBg(){
 const mobile=isMobile(), key=mobile?'mobileBg':'desktopBg';
 const blob=await dbGet(key), scene=$('scene');
 if(scene.dataset.url){URL.revokeObjectURL(scene.dataset.url);delete scene.dataset.url}
 if(blob){
  const u=URL.createObjectURL(blob);scene.dataset.url=u;scene.style.backgroundImage=`url("${u}")`;
 }else{
  scene.style.backgroundImage=`url("assets/${mobile?'background-mobile.jpg':'background-desktop.jpg'}")`;
 }
 scene.querySelector('svg').style.display='none';
}
async function applyMokAssets(){const m=await dbGet('mokImage'),s=await dbGet('strikerImage'),a=await dbGet('mokAudio');if(m){const u=URL.createObjectURL(m);$('mokArt').outerHTML=`<img id="mokArt" class="mok-art" src="${u}" alt="Mõ gỗ">`}if(s){const u=URL.createObjectURL(s);$('striker').style.background=`center/contain no-repeat url("${u}")`;$('striker').style.border='0';$('striker').style.boxShadow='none';$('striker').style.width='50px';$('striker').style.height='150px';$('striker').style.borderRadius='0'}}
function strikeVisualOnly(){const striker=$('striker');striker.classList.remove('hit');void striker.offsetWidth;striker.classList.add('hit');state.merit++;state.drops++;save();toast()}
renderPlaces();drawMenus();renderStats();applyBg();applyMokAssets();
let bgResizeTimer;window.addEventListener('resize',()=>{renderPlaces();clearTimeout(bgResizeTimer);bgResizeTimer=setTimeout(applyBg,120)});
</script></body></html>
